AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Scheduled opt-in AWS resource janitor with durable execution and account-scoped IAM
Parameters:
  JanitorName:
    Type: String
    Default: ephemeral-janitor
    AllowedPattern: '[A-Za-z][A-Za-z0-9-]{2,39}'
  DryRun:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  Mode:
    Type: String
    Default: stop
    AllowedValues: [stop, lifecycle]
  ScheduleExpression:
    Type: String
    Default: rate(15 minutes)
  ScheduleState:
    Type: String
    Default: ENABLED
    AllowedValues: [ENABLED, DISABLED]
  ResourceTypes:
    Type: String
    Default: ec2,ecs,eks,lambda,eventbridge,scheduler
    AllowedPattern: '(ec2|ecs|eks|lambda|eventbridge|scheduler)(,(ec2|ecs|eks|lambda|eventbridge|scheduler))*'
    Description: Comma-separated services to discover; policy still requires opt-in tags
  ManagedScheduleGroup:
    Type: String
    Default: ''
    AllowedPattern: '[A-Za-z0-9_.-]{0,64}'
    Description: Optional dedicated group whose tagged schedules may be disabled
  SchedulerTargetRoleArns:
    Type: String
    Default: ''
    Description: Comma-separated exact target role ARNs allowed for schedule updates
  TTLHours:
    Type: Number
    Default: 24
    MinValue: 1
    MaxValue: 87600
  GraceHours:
    Type: Number
    Default: 24
    MinValue: 1
    MaxValue: 87600
  MaxActionsPerRun:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
  MaxActionsPerWindow:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 1000
  WindowSeconds:
    Type: Number
    Default: 3600
    MinValue: 60
    MaxValue: 86400
  MaxResources:
    Type: Number
    Default: 1000
    MinValue: 1
    MaxValue: 10000
Conditions:
  Live: !Equals [!Ref DryRun, 'false']
  HasManagedSchedules: !Not [!Equals [!Ref ManagedScheduleGroup, '']]
  CanManageSchedules: !And [!Condition Live, !Condition HasManagedSchedules]
  CanPassScheduleRoles: !And [!Condition CanManageSchedules, !Not [!Equals [!Ref SchedulerTargetRoleArns, '']]]
  CanTerminate: !And [!Condition Live, !Equals [!Ref Mode, lifecycle]]
Resources:
  StateTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${JanitorName}-state'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      DeletionProtectionEnabled: true
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
  Notifications:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${JanitorName}-notifications'
  FailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${JanitorName}'
      RetentionInDays: 30
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ScopedJanitor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: sts:GetCallerIdentity
                Resource: '*'
              - Effect: Allow
                Action: [ec2:DescribeInstances, ec2:DescribeInstanceAttribute,
                         autoscaling:DescribeAutoScalingInstances, autoscaling:DescribeAutoScalingGroups,
                         ecs:ListClusters, ecs:ListServices, ecs:DescribeServices, ecs:ListTagsForResource,
                         eks:ListClusters, eks:ListNodegroups, eks:DescribeNodegroup,
                         lambda:ListFunctions, lambda:GetFunctionConfiguration, lambda:GetFunctionConcurrency,
                         lambda:ListTags, lambda:ListProvisionedConcurrencyConfigs,
                         events:ListRules, events:DescribeRule, events:ListTagsForResource,
                         scheduler:ListSchedules, scheduler:GetSchedule, scheduler:ListTagsForResource,
                         application-autoscaling:DescribeScalableTargets]
                Resource: '*'
                Condition:
                  StringEquals:
                    aws:RequestedRegion: !Ref AWS::Region
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:DeleteItem,
                         dynamodb:ConditionCheckItem, dynamodb:Query]
                Resource: !GetAtt StateTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: [!Sub 'scope#${AWS::AccountId}#${AWS::Region}']
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref Notifications
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailureQueue.Arn
              - Effect: Deny
                Action: lambda:PutFunctionConcurrency
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${JanitorName}'
              - Effect: Deny
                Action: scheduler:UpdateSchedule
                Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${JanitorName}/*'
              - !If
                - Live
                - Effect: Allow
                  Action: [ecs:UpdateService, lambda:PutFunctionConcurrency, events:DisableRule]
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:service/*'
                    - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
                    - !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*'
                  Condition:
                    StringEquals:
                      aws:ResourceTag/JanitorManaged: 'true'
                    'Null':
                      aws:ResourceTag/DoNotCleanup: 'true'
                - !Ref AWS::NoValue
              - !If
                - Live
                - Effect: Allow
                  Action: eks:UpdateNodegroupConfig
                  Resource: !Sub 'arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:nodegroup/*'
                  Condition:
                    StringEquals:
                      aws:ResourceTag/JanitorManaged: 'true'
                      aws:ResourceTag/JanitorAllowDisruption: 'true'
                    'Null':
                      aws:ResourceTag/DoNotCleanup: 'true'
                - !Ref AWS::NoValue
              - !If
                - CanManageSchedules
                - Effect: Allow
                  Action: scheduler:UpdateSchedule
                  Resource: !Sub 'arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ManagedScheduleGroup}/*'
                - !Ref AWS::NoValue
              - !If
                - CanPassScheduleRoles
                - Effect: Allow
                  Action: iam:PassRole
                  Resource: !Split [',', !Ref SchedulerTargetRoleArns]
                  Condition:
                    StringEquals:
                      iam:PassedToService: scheduler.amazonaws.com
                - !Ref AWS::NoValue
              - !If
                - Live
                - Effect: Allow
                  Action: ec2:StopInstances
                  Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/JanitorManaged: 'true'
                    'Null':
                      ec2:ResourceTag/DoNotCleanup: 'true'
                      ec2:ResourceTag/aws:autoscaling:groupName: 'true'
                      ec2:ResourceTag/aws:cloudformation:stack-id: 'true'
                      ec2:ResourceTag/eks:cluster-name: 'true'
                - !Ref AWS::NoValue
              - !If
                - CanTerminate
                - Effect: Allow
                  Action: ec2:TerminateInstances
                  Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*'
                  Condition:
                    StringEquals:
                      ec2:ResourceTag/JanitorManaged: 'true'
                      ec2:ResourceTag/JanitorAllowTerminate: 'true'
                    'Null':
                      ec2:ResourceTag/DoNotCleanup: 'true'
                      ec2:ResourceTag/aws:autoscaling:groupName: 'true'
                      ec2:ResourceTag/aws:cloudformation:stack-id: 'true'
                      ec2:ResourceTag/eks:cluster-name: 'true'
                - !Ref AWS::NoValue
  JanitorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Ref JanitorName
      CodeUri: src/
      Handler: janitor.handler.lambda_handler
      Runtime: python3.12
      MemorySize: 256
      Timeout: 300
      ReservedConcurrentExecutions: 1
      Role: !GetAtt ExecutionRole.Arn
      Environment:
        Variables:
          JANITOR_RESOURCE_TYPES: !Ref ResourceTypes
          JANITOR_SCHEDULER_ROLE_ARNS: !Ref SchedulerTargetRoleArns
          JANITOR_POLICY: !Sub |
            {"account_id":"${AWS::AccountId}","region":"${AWS::Region}",
             "table_name":"${StateTable}","dry_run":${DryRun},"mode":"${Mode}",
             "ttl_hours":${TTLHours},"grace_hours":${GraceHours},
             "max_actions_per_run":${MaxActionsPerRun},
             "max_actions_per_window":${MaxActionsPerWindow},
             "window_seconds":${WindowSeconds},"max_resources":${MaxResources},
             "notification_topic":"${Notifications}","scheduler_group":"${ManagedScheduleGroup}",
             "protected_arns":["arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${JanitorName}"]}
      EventInvokeConfig:
        MaximumEventAgeInSeconds: 300
        MaximumRetryAttempts: 0
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailureQueue.Arn
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Ref JanitorName
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnEquals:
                aws:SourceArn: !GetAtt ScheduleGroup.Arn
      Policies:
        - PolicyName: InvokeJanitor
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt JanitorFunction.Arn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt FailureQueue.Arn
  Schedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ScheduleGroup
      ScheduleExpression: !Ref ScheduleExpression
      State: !Ref ScheduleState
      FlexibleTimeWindow: {Mode: 'OFF'}
      Target:
        Arn: !GetAtt JanitorFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"schedule_arn":"<aws.scheduler.schedule-arn>","scheduled_time":"<aws.scheduler.scheduled-time>"}'
        RetryPolicy:
          MaximumEventAgeInSeconds: 300
          MaximumRetryAttempts: 0
        DeadLetterConfig:
          Arn: !GetAtt FailureQueue.Arn
  FunctionErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Janitor failed; inspect the durable run journal and retained lock
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref JanitorFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Notifications]
  UndeliveredEvents:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Scheduler delivery or Lambda execution failed; inspect the failure queue
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions: [{Name: QueueName, Value: !GetAtt FailureQueue.QueueName}]
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref Notifications]
Outputs:
  FunctionName:
    Value: !Ref JanitorFunction
  StateTableName:
    Value: !Ref StateTable
  NotificationTopicArn:
    Value: !Ref Notifications
  FailureQueueUrl:
    Value: !Ref FailureQueue
  ScheduleName:
    Value: !Ref Schedule
  ScheduleGroupName:
    Value: !Ref ScheduleGroup
